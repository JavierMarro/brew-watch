<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="304" viewBox="0 0 1080 304" role="img" aria-labelledby="title description">
  <title id="title">brew-watch</title>
  <desc id="description">A wooden cask with a small tap and a clock. Keep your brews from going stale. Checks every 14 days for formulae and casks.</desc>
