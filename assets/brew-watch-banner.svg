  <text x="222" y="65" fill="#aabbab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" letter-spacing="3">HOMEBREW / TERMINAL COMPANION</text>
  <text x="218" y="139" fill="#f3efe5" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="64" font-weight="600" letter-spacing="-2">brew-watch<tspan fill="#deb879">_</tspan></text>
  <text x="222" y="184" fill="#f3efe5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">Keep your brews from going stale.</text>
  <path d="M64 234h952" stroke="#3b4840"/>
  <text x="64" y="273" fill="#aabbab" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16">14-day checks<tspan dx="28">/</tspan><tspan dx="28">Formulae + casks</tspan><tspan dx="28">/</tspan><tspan dx="28">Your terminal, your call.</tspan></text>
